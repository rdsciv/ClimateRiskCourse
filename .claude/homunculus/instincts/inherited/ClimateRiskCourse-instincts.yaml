# ClimateRiskCourse Workflow Add Or Update Client Track

## Action

Follow the add-or-update-client-track workflow:
1. Add or update directories under clients/ with AGENTS.md, briefing, db, documents, outputs, portfolio, and summary files.
2. Update docs/clients.html, docs/reading/clients-overview.html, and related docs/reading/ex-00.03-choose-your-client-track.html.
3. Update exercises/00-orientation/00.03-choose-your-client-track/problem/readme.md and explainer/readme.md.
4. Update or add scripts/seed_<client>.py and scripts/seed_all_clients.py.
5. Update README.md and clients/README.md to reflect new tracks.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: clients/*/AGENTS.md, clients/*/briefing/engagement.md, clients/*/db/portfolio.sqlite

