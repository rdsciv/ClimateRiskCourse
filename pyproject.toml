[project]
name = "climate-risk-course"
version = "1.0.0"
description = "Climate risk assessment course — Grok Build"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
geo = ["geopy>=2.4"]
export = ["markdown>=3.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
